[workspace]
resolver = "2"
members = [
    "projects/harness/valkyrie-harness",
    "projects/harness/valkyrie-rusty-tests",
    "projects/fixtures/valkyrie-fixtures",
    "projects/fixtures/legion-fixtures",
    "projects/fixtures/von-fixtures",
    "projects/fixtures/voc-fixtures",
]
default-members = ["projects/fixtures/valkyrie-fixtures"]

[workspace.package]
version = "0.0.1"
edition = "2024"
authors = ["Nyar Team"]
license = "MIT"
repository = "https://github.com/valkyrie-language/valkyrie.rs"

# 本仓只保留 Valkyrie 生态的 fixtures 与 bootstrap 语料；编译器与产品实现归 nyar-vm.rs。
[workspace.dependencies]
# 白盒 harness / 集成测试经 git `rev` 链接；本机路径写在 `.cargo/config.toml`。
oak-awsl = { git = "https://github.com/yggdrasil-language/oak.rs", rev = "fc94201d43926ac3f75b3a4f7dd10ac219d73f6e" }
oak-core = { git = "https://github.com/yggdrasil-language/oak.rs", rev = "fc94201d43926ac3f75b3a4f7dd10ac219d73f6e" }
oak-testing = { git = "https://github.com/yggdrasil-language/oak.rs", rev = "fc94201d43926ac3f75b3a4f7dd10ac219d73f6e" }
oak-von = { git = "https://github.com/yggdrasil-language/oak.rs", rev = "fc94201d43926ac3f75b3a4f7dd10ac219d73f6e", features = ["serde"] }
oak-valkyrie = { git = "https://github.com/yggdrasil-language/oak.rs", rev = "fc94201d43926ac3f75b3a4f7dd10ac219d73f6e" }
rusty-valkyrie = { git = "https://github.com/nyar-vm/nyar-vm.rs", rev = "1a0e8a4dd498b21eb4f66b7c77c861c710f2a832" }
# harness 白盒测试夹具工具（runtime fixture sidecar / runner 模板）。
nyar = { git = "https://github.com/nyar-vm/nyar-vm.rs", rev = "1a0e8a4dd498b21eb4f66b7c77c861c710f2a832" }
nyar-runner = { git = "https://github.com/nyar-vm/nyar-vm.rs", rev = "1a0e8a4dd498b21eb4f66b7c77c861c710f2a832" }
# 迁移套件按其原始白盒依赖直接链接 nyar 编译链与 odin 运行时（同 `rusty-valkyrie` pin）。
nyar-analyzer = { git = "https://github.com/nyar-vm/nyar-vm.rs", rev = "1a0e8a4dd498b21eb4f66b7c77c861c710f2a832" }
nyar-emitter = { git = "https://github.com/nyar-vm/nyar-vm.rs", rev = "1a0e8a4dd498b21eb4f66b7c77c861c710f2a832" }
nyar-format = { git = "https://github.com/nyar-vm/nyar-vm.rs", rev = "1a0e8a4dd498b21eb4f66b7c77c861c710f2a832" }
nyar-package-manager = { git = "https://github.com/nyar-vm/nyar-vm.rs", rev = "1a0e8a4dd498b21eb4f66b7c77c861c710f2a832" }
nyar-types = { git = "https://github.com/nyar-vm/nyar-vm.rs", rev = "1a0e8a4dd498b21eb4f66b7c77c861c710f2a832" }
odin-vm = { git = "https://github.com/nyar-vm/nyar-vm.rs", rev = "1a0e8a4dd498b21eb4f66b7c77c861c710f2a832" }
# 后端产物解码套件直接消费 acorn 格式 crate（rev 与 nyar pin 依赖的 acorn 一致）。
acorn-aarch64 = { git = "https://github.com/yggdrasil-language/acorn.rs", rev = "ad42cd939481564dc69d2b42e1cab2c716317439" }
acorn-dex = { git = "https://github.com/yggdrasil-language/acorn.rs", rev = "ad42cd939481564dc69d2b42e1cab2c716317439" }
acorn-jvm = { git = "https://github.com/yggdrasil-language/acorn.rs", rev = "ad42cd939481564dc69d2b42e1cab2c716317439" }
acorn-odin = { git = "https://github.com/yggdrasil-language/acorn.rs", rev = "ad42cd939481564dc69d2b42e1cab2c716317439" }
acorn-pe = { git = "https://github.com/yggdrasil-language/acorn.rs", rev = "ad42cd939481564dc69d2b42e1cab2c716317439" }
acorn-wasm = { git = "https://github.com/yggdrasil-language/acorn.rs", rev = "ad42cd939481564dc69d2b42e1cab2c716317439" }

legion-fixtures = { path = "projects/fixtures/legion-fixtures" }

serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
tempfile = "3"
zip = "9.1.1"

[profile.release]
lto = false
opt-level = "s"

[profile.dev]
incremental = false

[profile.test]
incremental = false
