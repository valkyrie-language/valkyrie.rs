[workspace]
resolver = "2"
members = [
    "projects/legion",
    "projects/legion-unity",
    "projects/nyar",
    "projects/nyar-analyzer",
    "projects/nyar-optimizer",
    "projects/nyar-package-manager",
    "projects/nyar-package-registry",
    "projects/nyar-workspace",
    "projects/std-data",
    "projects/nyar-emitter",
    "projects/nyar-types",
    "projects/nyar-language",
    "projects/nyar-runner",
    "projects/nvm",
    "projects/legacy-vm",
    "projects/legend",
    "projects/text-vm",
    "projects/text-vm-compiler",
    "projects/asgard",
    "projects/noodle",
    "projects/panda",
]
default-members = [
    "projects/legion",
    "projects/asgard",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Nyar Team"]
license = "MIT"
repository = "https://github.com/valkyrie-language/valkyrie.rs"

[workspace.dependencies]
std-data = { path = "projects/std-data" }
nyar-types = { path = "projects/nyar-types" }
nyar-analyzer = { path = "projects/nyar-analyzer" }   # Nyar HIR
nyar-optimizer = { path = "projects/nyar-optimizer" } # Nyar MIR
emitter = { path = "projects/nyar-emitter", package = "nyar-emitter" }                            # Nyar LIR
nyar-language = { path = "projects/nyar-language" }
nyar-runner = { path = "projects/nyar-runner" }
nvm = { path = "projects/nvm" }
legacy-vm = { path = "projects/legacy-vm" }
legend = { path = "projects/legend" }
text-vm = { path = "projects/text-vm" }
text-vm-compiler = { path = "projects/text-vm-compiler" }
nyar = { path = "projects/nyar" }
nyar-package-manager = { path = "projects/nyar-package-manager" }
nyar-package-registry = { path = "projects/nyar-package-registry" }
nyar-workspace = { path = "projects/nyar-workspace" }
voa = { path = "projects/asgard" }
noodle = { path = "projects/noodle" }
panda = { path = "projects/panda" }
miette = "7.6.0"
ordered-float = "5.3.0"
clap = { version = "4.6.1", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.150"
toml_edit = "0.22.27"
serde_yaml = "0.9.34"
sha1 = "0.10.6"
sha2 = "0.10.9"
url = "2.5.8"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
tempfile = "3.27.0"
pulldown-cmark = "0.13.0"
syntect = "5.2.0"
katex-rs = "0.2.4"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls", "system-proxy"] }
flate2 = "1.1.2"
tar = "0.4.44"
base64 = "0.22.1"
ed25519-dalek = "2.1.1"
thiserror = "2.0.17"

[profile.release]
lto = false
opt-level = "s"

[profile.dev]
incremental = false

[profile.test]
incremental = false
