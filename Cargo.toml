[workspace]
resolver = "2"
members = [
    "projects/compilers/legion",
    "projects/compilers/legion-workspace",
    "projects/compilers/vcc-data",
    "projects/compilers/vcc-napi",
    "projects/compilers/vcc-wasm",
    "projects/compilers/asgard",
    "projects/compilers/valkyrie-fixtures",
    "projects/compilers/von-fixtures",
    "projects/compilers/voc-fixtures",
]
default-members = [
    "projects/compilers/legion",
    "projects/compilers/vcc-napi",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
authors = ["Nyar Team"]
license = "MIT"
repository = "https://github.com/valkyrie-language/valkyrie.rs"

[workspace.dependencies]
oak-awsl = { git = "https://github.com/yggdrasil-language/oak.rs", rev = "054b27ef24f30f9715ad6da0b918291052e136f7" }
oak-core = { git = "https://github.com/yggdrasil-language/oak.rs", rev = "054b27ef24f30f9715ad6da0b918291052e136f7" }
oak-testing = { git = "https://github.com/yggdrasil-language/oak.rs", rev = "054b27ef24f30f9715ad6da0b918291052e136f7" }
oak-von = { git = "https://github.com/yggdrasil-language/oak.rs", rev = "054b27ef24f30f9715ad6da0b918291052e136f7", features = ["serde"] }
oak-valkyrie = { git = "https://github.com/yggdrasil-language/oak.rs", rev = "054b27ef24f30f9715ad6da0b918291052e136f7" }

vcc-data = { path = "projects/compilers/vcc-data" }

# Compiler / VM stack lives in nyar-vm.rs. CI resolves these from the pinned `rev`.
# Local sibling checkout: copy `.cargo/config.example.toml` to `.cargo/config.toml`.
nyar = { git = "https://github.com/nyar-vm/nyar-vm.rs", rev = "113e38ab42cda7a25c88fb91e197b252270a05ec" }
nyar-analyzer = { git = "https://github.com/nyar-vm/nyar-vm.rs", rev = "113e38ab42cda7a25c88fb91e197b252270a05ec" }
nyar-emitter = { git = "https://github.com/nyar-vm/nyar-vm.rs", rev = "113e38ab42cda7a25c88fb91e197b252270a05ec" }
nyar-language = { git = "https://github.com/nyar-vm/nyar-vm.rs", rev = "113e38ab42cda7a25c88fb91e197b252270a05ec" }
nyar-optimizer = { git = "https://github.com/nyar-vm/nyar-vm.rs", rev = "113e38ab42cda7a25c88fb91e197b252270a05ec" }
nyar-package-manager = { git = "https://github.com/nyar-vm/nyar-vm.rs", rev = "113e38ab42cda7a25c88fb91e197b252270a05ec" }
nyar-package-registry = { git = "https://github.com/nyar-vm/nyar-vm.rs", rev = "113e38ab42cda7a25c88fb91e197b252270a05ec" }
nyar-runner = { git = "https://github.com/nyar-vm/nyar-vm.rs", rev = "113e38ab42cda7a25c88fb91e197b252270a05ec" }
nyar-types = { git = "https://github.com/nyar-vm/nyar-vm.rs", rev = "113e38ab42cda7a25c88fb91e197b252270a05ec" }
nyar-workspace = { git = "https://github.com/nyar-vm/nyar-vm.rs", rev = "113e38ab42cda7a25c88fb91e197b252270a05ec" }
nyar-bytecode = { git = "https://github.com/nyar-vm/nyar-vm.rs", rev = "113e38ab42cda7a25c88fb91e197b252270a05ec" }

asgard = { path = "projects/compilers/asgard" }
legion = { path = "projects/compilers/legion" }
legion-workspace = { path = "projects/compilers/legion-workspace" }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Console"] }



miette = "7.6.0"
ordered-float = "5.3.0"
clap = { version = "4.6.1", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.150"
toml_edit = "0.25.17+spec-1.1.0"
serde_yaml = "0.9.34"
sha1 = "0.11.0"
sha2 = "0.11.1"
url = "2.5.8"
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }
tempfile = "3.27.0"
pulldown-cmark = "0.13.0"
syntect = "5.2.0"
katex-rs = "0.3.0"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls-tls", "system-proxy"] }
flate2 = "1.1.2"
tar = "0.4.44"
base64 = "0.23.1"
ed25519-dalek = "3.0.0"
thiserror = "2.0.17"
napi = { version = "3.14.2", default-features = false, features = ["napi8"] }
napi-derive = "3.6.12"
napi-build = "2"
gag = "1.0.0"

[profile.release]
lto = false
opt-level = "s"

[profile.dev]
incremental = false

[profile.test]
incremental = false
