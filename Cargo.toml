[workspace]
resolver = "2"
members = [
    "projects/harness/valkyrie-harness",
    "projects/harness/valkyrie-rusty-tests",
    "projects/napi/valkyrie-napi",
    "projects/fixtures/valkyrie-fixtures",
    "projects/fixtures/legion-fixtures",
    "projects/fixtures/von-fixtures",
    "projects/fixtures/voc-fixtures",
]
default-members = ["projects/fixtures/valkyrie-fixtures"]

[workspace.package]
version = "0.0.1"
edition = "2024"
authors = ["Nyar Team"]
license = "MIT"
repository = "https://github.com/valkyrie-language/valkyrie.rs"

# 本仓只保留 Valkyrie 生态的 fixtures 与 bootstrap 语料；编译器与产品实现归 nyar-vm.rs。
[workspace.dependencies]
# 白盒 harness / 集成测试经 git `rev` 链接；本机路径写在 `.cargo/config.toml`。
data-text-awsl = { git = "https://github.com/oovm/rust-boost", rev = "71db8fa50f49e3693640cbd19e64ad9c797e5932" }
data-text-core = { git = "https://github.com/oovm/rust-boost", rev = "71db8fa50f49e3693640cbd19e64ad9c797e5932" }
language-testing = { git = "https://github.com/oovm/rust-boost", rev = "71db8fa50f49e3693640cbd19e64ad9c797e5932" }
data-text-von = { git = "https://github.com/oovm/rust-boost", rev = "71db8fa50f49e3693640cbd19e64ad9c797e5932", features = ["serde"] }
data-text-valkyrie = { git = "https://github.com/oovm/rust-boost", rev = "71db8fa50f49e3693640cbd19e64ad9c797e5932" }
rusty-valkyrie = { git = "https://github.com/nyar-vm/nyar-vm.rs", rev = "1a0e8a4dd498b21eb4f66b7c77c861c710f2a832" }
# Node-API 导出层的唯一实现依赖：Boost 的 Valkyrie 语言消费门面。
language-valkyrie = { git = "https://github.com/oovm/rust-boost", rev = "c083f802262f9f6cdaf6cd4346ba6d018028fb38" }
# harness 白盒测试夹具工具（runtime fixture sidecar / runner 模板）。
nyar = { git = "https://github.com/nyar-vm/nyar-vm.rs", rev = "1a0e8a4dd498b21eb4f66b7c77c861c710f2a832" }
nyar-runner = { git = "https://github.com/nyar-vm/nyar-vm.rs", rev = "1a0e8a4dd498b21eb4f66b7c77c861c710f2a832" }
# 迁移套件按其原始白盒依赖直接链接 nyar 编译链与 odin 运行时（同 `rusty-valkyrie` pin）。
nyar-analyzer = { git = "https://github.com/nyar-vm/nyar-vm.rs", rev = "1a0e8a4dd498b21eb4f66b7c77c861c710f2a832" }
nyar-emitter = { git = "https://github.com/nyar-vm/nyar-vm.rs", rev = "1a0e8a4dd498b21eb4f66b7c77c861c710f2a832" }
nyar-format = { git = "https://github.com/nyar-vm/nyar-vm.rs", rev = "1a0e8a4dd498b21eb4f66b7c77c861c710f2a832" }
nyar-package-manager = { git = "https://github.com/nyar-vm/nyar-vm.rs", rev = "1a0e8a4dd498b21eb4f66b7c77c861c710f2a832" }
nyar-types = { git = "https://github.com/nyar-vm/nyar-vm.rs", rev = "1a0e8a4dd498b21eb4f66b7c77c861c710f2a832" }
odin-vm = { git = "https://github.com/nyar-vm/nyar-vm.rs", rev = "1a0e8a4dd498b21eb4f66b7c77c861c710f2a832" }
# 后端产物解码套件直接消费 Boost `data.binary` 格式 crate（同 `data-text` pin）。
data-binary-aarch64 = { git = "https://github.com/oovm/rust-boost", rev = "71db8fa50f49e3693640cbd19e64ad9c797e5932" }
data-binary-dex = { git = "https://github.com/oovm/rust-boost", rev = "71db8fa50f49e3693640cbd19e64ad9c797e5932" }
data-binary-jvm = { git = "https://github.com/oovm/rust-boost", rev = "71db8fa50f49e3693640cbd19e64ad9c797e5932" }
data-binary-odin = { git = "https://github.com/oovm/rust-boost", rev = "71db8fa50f49e3693640cbd19e64ad9c797e5932" }
data-binary-pe = { git = "https://github.com/oovm/rust-boost", rev = "71db8fa50f49e3693640cbd19e64ad9c797e5932" }
data-binary-wasm = { git = "https://github.com/oovm/rust-boost", rev = "71db8fa50f49e3693640cbd19e64ad9c797e5932" }

legion-fixtures = { path = "projects/fixtures/legion-fixtures" }

serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
tempfile = "3"
zip = "9.1.1"

# Node-API 导出层（`projects/napi/valkyrie-napi`）：只绑定 Boost `language.valkyrie`。
napi = { version = "3.14.2", default-features = true, features = ["napi4"] }
napi-derive = "3.6.12"
napi-build = "2"
gag = "1.0.0"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Console"] }

[profile.release]
lto = false
opt-level = "s"

[profile.dev]
incremental = false

[profile.test]
incremental = false
