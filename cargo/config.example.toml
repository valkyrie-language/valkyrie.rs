nyar-language = { path = "../nyar-vm.rs/projects/compilers/nyar-language" }
nyar-optimizer = { path = "../nyar-vm.rs/projects/compilers/nyar-optimizer" }
nyar-package-manager = { path = "../nyar-vm.rs/projects/compilers/nyar-package-manager" }
nyar-package-registry = { path = "../nyar-vm.rs/projects/compilers/nyar-package-registry" }
nyar-runner = { path = "../nyar-vm.rs/projects/compilers/nyar-runner" }
nyar-types = { path = "../nyar-vm.rs/projects/compilers/nyar-types" }
nyar-workspace = { path = "../nyar-vm.rs/projects/compilers/nyar-workspace" }
