targets:
- clr-microsoft-unknown-managed
- jvm-openjdk-unknown-managed
- wasm32-node-unknown-wasm
- wasm32-unknown-wasi-wasi
expect:
  clr-microsoft-unknown-managed:
    build_success: true
    dry_run_success: true
    run_success: false
    run_contracts:
    - logical_entry: main
      physical_entry: legion.exe
      invocation: dotnet
      validate: dotnet exec legion.exe
    per_artifact:
      legion.exe:
        run_success: false
        exit_code: -2147450749
        stdout: []
        stderr:
        - A fatal error was encountered. The library 'hostpolicy.dll' required to execute the application was not found in 'C:\Users\Administrator\AppData\Local\Temp\legion-run-<normalized>\app\dist\clr\'.
        - Failed to run as a self-contained app.
        - '  - The application was run as a self-contained app because ''C:\Users\Administrator\AppData\Local\Temp\legion-run-<normalized>\app\dist\clr\legion.runtimeconfig.json'' was not found.'
        - '  - If this should be a framework-dependent app, add the ''C:\Users\Administrator\AppData\Local\Temp\legion-run-<normalized>\app\dist\clr\legion.runtimeconfig.json'' file and specify the appropriate framework.'
    artifacts:
    - compile-evidence.txt
    - legion.exe
    - run-contracts.txt
    compile_errors: []
    errors: []
  jvm-openjdk-unknown-managed:
    build_success: true
    dry_run_success: false
    run_success: false
    run_contracts: []
    per_artifact: {}
    artifacts:
    - compile-evidence.txt
    - legion.jar
    compile_errors: []
    errors:
    - 'run command failed for jvm-openjdk-unknown-managed: missing execution manifest after build: \\?\C:\Users\Administrator\AppData\Local\Temp\legion-run-minimal_clivE0VNo\app\dist\jvm\run-contracts.txt'
  wasm32-node-unknown-wasm:
    build_success: true
    dry_run_success: true
    run_success: true
    run_contracts:
    - logical_entry: main
      physical_entry: legion.mjs
      invocation: node
      validate: node legion.mjs
    per_artifact:
      legion.mjs:
        run_success: true
        exit_code: 0
        stdout: []
        stderr: []
    artifacts:
    - compile-evidence.txt
    - legion.mjs
    - legion.wasm
    - run-contracts.txt
    compile_errors: []
    errors: []
  wasm32-unknown-wasi-wasi:
    build_success: true
    dry_run_success: true
    run_success: false
    run_contracts:
    - logical_entry: _start
      physical_entry: legion.wasi
      invocation: wasmtime
      validate: wasmtime run -W gc -W wmemcheck -W max-memory-size=16777216 legion.wasi
    per_artifact:
      legion.wasi:
        run_success: false
        exit_code: 1
        stdout: []
        stderr:
        - 'Error: wmemcheck (memory checker) was requested but is not enabled in this build'
    artifacts:
    - compile-evidence.txt
    - legion.component-wit/
    - legion.component-wit/component.wit
    - legion.component-wit/deps/
    - legion.component-wit/deps/wasi-cli-0.2.12.wit
    - legion.core.wasm
    - legion.wasi
    - run-contracts.txt
    - wasmtime-config.toml
    - wasmtime-home/
    - wasmtime-local-app-data/
    - wasmtime-tmp/
    compile_errors: []
    errors: []
