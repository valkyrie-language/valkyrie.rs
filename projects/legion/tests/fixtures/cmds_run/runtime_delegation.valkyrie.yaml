targets:
- clr-microsoft-unknown-managed
- jvm-openjdk-unknown-managed
- wasm32-node-unknown-wasm
- wasm32-unknown-wasi-wasi
expect:
  clr-microsoft-unknown-managed:
    build_success: true
    dry_run_success: true
    run_success: true
    run_contracts:
    - logical_entry: Main
      physical_entry: main.exe
      invocation: dotnet
      validate: dotnet exec main.exe
    per_artifact:
      main.exe:
        run_success: true
        exit_code: 0
        stdout: []
        stderr: []
    artifacts:
    - main.exe
    - main.msil
    - main.runtimeconfig.json
    - run-contract.txt
    - run-contracts.txt
    compile_errors: []
    errors: []
  jvm-openjdk-unknown-managed:
    build_success: true
    dry_run_success: true
    run_success: true
    run_contracts:
    - logical_entry: main.functions
      physical_entry: main.jar
      invocation: java
      validate: java -jar main.jar
    per_artifact:
      main.jar:
        run_success: true
        exit_code: 0
        stdout: []
        stderr: []
    artifacts:
    - main.class
    - main.jar
    - run-contract.txt
    - run-contracts.txt
    compile_errors: []
    errors: []
  wasm32-node-unknown-wasm:
    build_success: true
    dry_run_success: true
    run_success: true
    run_contracts:
    - logical_entry: main
      physical_entry: main.mjs
      invocation: node
      validate: node main.mjs
    per_artifact:
      main.mjs:
        run_success: true
        exit_code: 0
        stdout: []
        stderr: []
    artifacts:
    - main.mjs
    - main.wasm
    - run-contract.txt
    - run-contracts.txt
    compile_errors: []
    errors: []
  wasm32-unknown-wasi-wasi:
    build_success: true
    dry_run_success: true
    run_success: true
    run_contracts:
    - logical_entry: _start
      physical_entry: main.wasi
      invocation: wasmtime
      validate: wasmtime run -W gc main.wasi
    per_artifact:
      main.wasi:
        run_success: true
        exit_code: 0
        stdout: []
        stderr: []
    artifacts:
    - main.component.wit
    - main.wasi
    - run-contract.txt
    - run-contracts.txt
    - wasmtime-config.toml
    - wasmtime-home/
    - wasmtime-local-app-data/
    - wasmtime-tmp/
    compile_errors: []
    errors: []
