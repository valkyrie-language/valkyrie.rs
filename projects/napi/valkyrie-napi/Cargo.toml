[package]
name = "valkyrie-napi"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Valkyrie Node-API 导出库：绑定 Boost `language.valkyrie` 与 `package.manager.legion` 的宿主友好表面"

[lib]
name = "valkyrie_napi"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
package-manager-legion = { workspace = true }
napi = { workspace = true }
napi-derive = { workspace = true }
windows-sys = { workspace = true }

[build-dependencies]
napi-build = { workspace = true }

[target.'cfg(not(windows))'.dependencies]
gag = { workspace = true }
