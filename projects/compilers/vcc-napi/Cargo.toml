[package]
name = "vcc-napi"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Valkyrie Compiler Collect — Node-API native bindings for Legion / Asgard hosts"

[lib]
name = "vcc_napi"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
legion = { path = "../legion" }
asgard = { workspace = true }
miette = { workspace = true, features = ["fancy"] }
