targets:
- clr-microsoft-unknown-managed
- jvm-openjdk-unknown-managed
- wasm32-node-unknown-wasm
- wasm32-unknown-wasi-wasi
expect:
  clr-microsoft-unknown-managed:
    build_success: false
    dry_run_success: false
    run_success: false
    run_contracts: []
    per_artifact: {}
    artifacts: []
    compile_errors:
    - 'build failed for clr-microsoft-unknown-managed: `Clr` lane is frozen for 0.0.x Node/Wasm delivery; enable Cargo feature `legacy-lanes` to compile CLR/JVM/native/nyar_vm lowering'
    errors: []
  jvm-openjdk-unknown-managed:
    build_success: false
    dry_run_success: false
    run_success: false
    run_contracts: []
    per_artifact: {}
    artifacts: []
    compile_errors:
    - 'build failed for jvm-openjdk-unknown-managed: `Jvm` lane is frozen for 0.0.x Node/Wasm delivery; enable Cargo feature `legacy-lanes` to compile CLR/JVM/native/nyar_vm lowering'
    errors: []
  wasm32-node-unknown-wasm:
    build_success: true
    dry_run_success: true
    run_success: true
    run_contracts:
    - logical_entry: main
      physical_entry: legion.mjs
      invocation: node
      validate: node legion.mjs
    per_artifact:
      legion.mjs:
        run_success: true
        exit_code: 0
        stdout: []
        stderr: []
    artifacts:
    - legion.mjs
    - legion.wasm
    - run-contract.txt
    - run-contracts.txt
    compile_errors: []
    errors: []
  wasm32-unknown-wasi-wasi:
    build_success: false
    dry_run_success: false
    run_success: false
    run_contracts: []
    per_artifact: {}
    artifacts:
    - legion.component-wit/
    - legion.component-wit/component.wit
    - legion.component-wit/deps/
    - legion.component-wit/deps/wasi-cli-0.2.12.wit
    - legion.core.wasm
    compile_errors:
    - 'build failed for wasm32-unknown-wasi-wasi: 调用 `wasm-tools` 失败'
    errors: []
