[package]
name = "legion"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
# LeetCode / 正式编译链默认只启用 Nyar + Node/Wasm seed；不链接 `vcc-data` 或自举旁路。
default = ["nyar-vm-lane"]
nyar-vm-lane = ["nyar-emitter/nyar-vm-lane"]
legacy-lanes = ["nyar-vm-lane"]
# `legion spy *` 诊断（Wasm/JVM/CLR/Native 格式解码），不属于 build/run 生产链。
format-spy = ["dep:vcc-data"]
# `legion bootstrap` 自举验收，不属于 LeetCode 双 target 正式链。
bootstrap-lane = []

[dependencies]
legion-workspace = { workspace = true }
clap = { workspace = true }
miette = { workspace = true, features = ["fancy"] }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
nyar-emitter = { workspace = true }
nyar-package-manager = { workspace = true }
nyar-workspace = { workspace = true }
oak-core = { workspace = true }
oak-von = { workspace = true }
oak-valkyrie = { workspace = true }
vcc-data = { workspace = true, features = ["serde"], optional = true }
# WASM 段/指令解码的唯一所有者（`legion spy wasm` 直接消费，不再走 vcc-data 副本）。
acorn-wasm = { workspace = true }
nyar-language = { workspace = true, features = ["serde"] }
nyar-analyzer = { workspace = true }
nyar-runner = { workspace = true }
nyar-types = { workspace = true }
nyar = { workspace = true }
nyar-bytecode = { workspace = true }
zip = { workspace = true }
sha2 = { workspace = true }
pulldown-cmark = { workspace = true }
asgard = { workspace = true }
gag = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
nyar = { workspace = true }
zip = { workspace = true }

[[test]]
name = "cmds_spy_wasm"
path = "tests/cmds_spy_wasm.rs"
required-features = ["format-spy"]

[[test]]
name = "cmds_spy_clr"
path = "tests/cmds_spy_clr.rs"
required-features = ["format-spy"]

[[test]]
name = "cmds_spy_pe_parser"
path = "tests/cmds_spy_pe_parser.rs"
required-features = ["format-spy"]

[[test]]
name = "cmds_spy_jvm"
path = "tests/cmds_spy_jvm.rs"
required-features = ["format-spy"]

[[example]]
name = "dump_sources"
path = "examples/dump_sources/main.rs"

[[example]]
name = "dump_group_offset"
path = "examples/dump_group_offset.rs"

