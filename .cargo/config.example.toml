# Local sibling checkout of nyar-vm.rs (copy to `.cargo/config.toml`).
# CI resolves nyar-* from git `dev`; this patch is for offline / monorepo dev only.

[patch."https://github.com/nyar-vm/nyar-vm.rs"]
nyar = { path = "<your-path>/nyar-vm.rs/projects/compilers/nyar" }
nyar-analyzer = { path = "<your-path>/nyar-vm.rs/projects/compilers/nyar-analyzer" }
nyar-emitter = { path = "<your-path>/nyar-vm.rs/projects/compilers/nyar-emitter" }
odin-bytecode = { path = "<your-path>/nyar-vm.rs/projects/formats/odin-bytecode" }
nyar-language = { path = "<your-path>/nyar-vm.rs/projects/compilers/nyar-language" }
nyar-optimizer = { path = "<your-path>/nyar-vm.rs/projects/compilers/nyar-optimizer" }
nyar-package-manager = { path = "<your-path>/nyar-vm.rs/projects/compilers/nyar-package-manager" }
nyar-package-registry = { path = "<your-path>/nyar-vm.rs/projects/compilers/nyar-package-registry" }
nyar-runner = { path = "<your-path>/nyar-vm.rs/projects/compilers/nyar-runner" }
nyar-types = { path = "<your-path>/nyar-vm.rs/projects/compilers/nyar-types" }
nyar-workspace = { path = "<your-path>/nyar-vm.rs/projects/compilers/nyar-workspace" }

# Optional oak.rs sibling patch (CI uses git `dev`; uncomment and point at your checkout):
[patch."https://github.com/yggdrasil-language/oak.rs"]
oak-awsl = { path = "<your-path>/oaks/examples/oak-voc" }
oak-core = { path = "<your-path>/oaks/projects/oak-core" }
oak-testing = { path = "<your-path>/oaks/projects/oak-testing" }
oak-valkyrie = { path = "<your-path>/oaks/examples/oak-valkyrie" }
oak-von = { path = "<your-path>/oaks/examples/oak-von" }
