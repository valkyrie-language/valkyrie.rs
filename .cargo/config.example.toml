# Copy to `.cargo/config.toml` (gitignored). Do not commit real paths.
# Replace `<your-path>` with the directory that contains sibling checkouts `nyar-vm.rs` / `rust-boost`.
# CI resolves nyar-* / data-* from git `rev` in `Cargo.toml`.
#
# 黑盒 Legion/Asgard 走 `@nyar/valkyrie`（根 `package.json`）；白盒链走下方 nyar-vm patch。

[patch."https://github.com/nyar-vm/nyar-vm.rs"]
rusty-valkyrie = { path = "<your-path>/nyar-vm.rs/projects/nyar.rs/languages/rusty-valkyrie" }
nyar = { path = "<your-path>/nyar-vm.rs/projects/nyar.rs/compilers/nyar" }
nyar-analyzer = { path = "<your-path>/nyar-vm.rs/projects/nyar.rs/compilers/nyar-analyzer" }
nyar-emitter = { path = "<your-path>/nyar-vm.rs/projects/nyar.rs/compilers/nyar-emitter" }
nyar-format = { path = "<your-path>/nyar-vm.rs/projects/nyar.rs/compilers/nyar-format" }
odin-bytecode = { path = "<your-path>/nyar-vm.rs/projects/nyar.rs/formats/odin-bytecode" }
nyar-optimizer = { path = "<your-path>/nyar-vm.rs/projects/nyar.rs/compilers/nyar-optimizer" }
nyar-package-manager = { path = "<your-path>/nyar-vm.rs/projects/nyar.rs/compilers/nyar-package-manager" }
nyar-package-registry = { path = "<your-path>/nyar-vm.rs/projects/nyar.rs/compilers/nyar-package-registry" }
nyar-runner = { path = "<your-path>/nyar-vm.rs/projects/nyar.rs/compilers/nyar-runner" }
nyar-types = { path = "<your-path>/nyar-vm.rs/projects/nyar.rs/compilers/nyar-types" }
nyar-workspace = { path = "<your-path>/nyar-vm.rs/projects/nyar.rs/compilers/nyar-workspace" }

[patch."https://github.com/oovm/rust-boost"]
data-binary-aarch64 = { path = "<your-path>/rust-boost/projects/data/data.binary.aarch64" }
data-binary-dex = { path = "<your-path>/rust-boost/projects/data/data.binary.dex" }
data-binary-jvm = { path = "<your-path>/rust-boost/projects/data/data.binary.jvm" }
data-binary-odin = { path = "<your-path>/rust-boost/projects/data/data.binary.odin" }
data-binary-pe = { path = "<your-path>/rust-boost/projects/data/data.binary.pe" }
data-binary-wasm = { path = "<your-path>/rust-boost/projects/data/data.binary.wasm" }
data-text-awsl = { path = "<your-path>/rust-boost/projects/data/data.text.awsl" }
data-text-core = { path = "<your-path>/rust-boost/projects/data/data.text.core" }
data-text-valkyrie = { path = "<your-path>/rust-boost/projects/data/data.text.valkyrie" }
data-text-von = { path = "<your-path>/rust-boost/projects/data/data.text.von" }
language-testing = { path = "<your-path>/rust-boost/projects/language/language.testing" }

# OdinVM 独立仓本地 overlay。
[patch."https://github.com/nyar-vm/odin-vm"]
odin-vm = { path = "<your-path>/odin-vm/projects/runtime/odin-vm" }
