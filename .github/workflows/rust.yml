name: Rust

on:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ master, dev ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - name: Rust Nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - name: Install Wasmtime
        uses: bytecodealliance/actions/wasmtime/setup@v1
        with:
          github_token: ${{ github.token }}
      - name: Verify Wasmtime
        run: wasmtime --version
      - name: Build legion (Wasm seed CLI)
        run: cargo build --release -p legion
      - name: Build workspace
        continue-on-error: true
        run: cargo build --release
      - name: Tests (workspace — frozen lanes may fail)
        continue-on-error: true
        run: cargo test --release
      - name: GPU tests (nyar.gpu_fragment)
        continue-on-error: true
        run: cargo test --release -p nyar --test gpu_fragment
      - name: GPU tests (legion.artifact_formats)
        run: cargo test --release -p legion artifact_formats

  # Required gate for Legion 0.0.x Node/Wasm seed package path.
  wasm-seed:
    name: Wasm seed (legion.tools → assemble)
    runs-on: ubuntu-latest
    steps:
      - run: git config --global core.autocrlf false
      - name: Checkout valkyrie.rs
        uses: actions/checkout@v5
      - name: Checkout valkyrie.v
        uses: actions/checkout@v5
        with:
          repository: valkyrie-language/valkyrie.v
          ref: dev
          path: valkyrie.v
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Rust Nightly
        uses: dtolnay/rust-toolchain@nightly
      - name: Install Wasmtime
        uses: bytecodealliance/actions/wasmtime/setup@v1
        with:
          github_token: ${{ github.token }}
      - name: Build legion CLI
        run: cargo build -p legion --release
      - name: Node entry contract tests
        run: cargo test -p legion --test bootstrap_node_entry --release
      - name: Build legion.tools for Node
        shell: bash
        run: |
          set -euo pipefail
          tools="valkyrie.v/projects/legion._/projects/legion.tools"
          out="dist/legion-node"
          mkdir -p "$out"
          ./target/release/legion build "$tools" --target node -o "$out"
      - name: Assemble and pack
        shell: bash
        run: |
          set -euo pipefail
          vsha="$(git -C valkyrie.v rev-parse HEAD)"
          node scripts/assemble-legion-wasm.mjs --from dist/legion-node --v-commit "$vsha"
          bytes="$(wc -c < packages/legion-wasm/legion.wasm)"
          echo "legion.wasm bytes=$bytes"
          test "$bytes" -ge 1024
          grep -q 'physical_entry: "legion.mjs"' packages/legion-wasm/run-contracts.txt
          ! grep -qi 'placeholder-minimal-wasm' packages/legion-wasm/run-contracts.txt
          npm pack ./packages/legion-wasm

  coverage:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: Rust Nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
      - name: Install Wasmtime
        uses: bytecodealliance/actions/wasmtime/setup@v1
        with:
          github_token: ${{ github.token }}
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate code coverage
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: false

  asgard-demo-matrix:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: Rust Nightly
        uses: dtolnay/rust-toolchain@nightly
      - name: Install Wasmtime
        uses: bytecodealliance/actions/wasmtime/setup@v1
        with:
          github_token: ${{ github.token }}
      - name: Build asgard CLI
        run: cargo build --release -p asgard
      - name: Build demo.android
        run: |
          if [ -d "../valkyrie.v/examples/demo.android" ]; then
            cargo run --release -p voa -- build ../valkyrie.v/examples/demo.android
          else
            echo "skip demo.android (valkyrie.v not in checkout)"
          fi
      - name: Build demo.ios
        run: |
          if [ -d "../valkyrie.v/examples/demo.ios" ]; then
            cargo run --release -p voa -- build ../valkyrie.v/examples/demo.ios
          fi
      - name: Build demo.wechat.miniprogram
        run: |
          if [ -d "../valkyrie.v/examples/demo.wechat.miniprogram" ]; then
            cargo run --release -p voa -- build ../valkyrie.v/examples/demo.wechat.miniprogram
          fi
      - name: Assert no placeholder magic in dist
        shell: bash
        run: |
          for demo in demo.android demo.ios demo.wechat.miniprogram; do
            dist="../valkyrie.v/examples/$demo/dist"
            if [ -d "$dist" ]; then
              if grep -rq "ASGDHOST" "$dist" 2>/dev/null; then exit 1; fi
              if grep -rq "asgard/Placeholder" "$dist" 2>/dev/null; then exit 1; fi
            fi
          done

  value-semantics-gate:
    runs-on: ubuntu-latest
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - name: Rust Nightly
        uses: dtolnay/rust-toolchain@nightly
      - name: Install Wasmtime
        uses: bytecodealliance/actions/wasmtime/setup@v1
        with:
          github_token: ${{ github.token }}
      - name: Value semantics frontend + MIR invariants (nyar-language::valkyrie)
        run: cargo test -p nyar-language --test valkyrie value_semantics -- --skip backend_fragment_carries_mir_final_aggregate_layouts
      - name: Value type checker regression (nyar-language::type_checker::value_type)
        run: cargo test -p nyar-language --test valkyrie type_checker::value_type
      - name: Cross-backend parity integration tests (nyar_emittervalue_semantics_parity)
        continue-on-error: true
        run: cargo test -p emitter --test value_semantics_parity
      - name: CLR backend regression (nyar-backend-clr)
        continue-on-error: true
        run: cargo test -p nyar-backend-clr
      - name: JVM backend regression (nyar-backend-jvm)
        continue-on-error: true
        run: cargo test -p nyar-backend-jvm
      - name: WASI backend regression (nyar-backend-wasi)
        continue-on-error: true
        run: cargo test -p nyar-backend-wasi
      - name: Emitter JVM lowering regression (emitter jvm)
        continue-on-error: true
        run: cargo test -p emitter jvm
      - name: Emitter WASM lowering regression (emitter wasm)
        run: cargo test -p emitter wasm
      - name: Emitter NyarVM lowering regression (emitter nyar_vm)
        continue-on-error: true
        run: cargo test -p emitter nyar_vm
      - name: Emitter Native lowering regression (emitter native)
        continue-on-error: true
        run: cargo test -p emitter native
